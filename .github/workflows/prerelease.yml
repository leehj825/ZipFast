name: Prerelease

# Builds the universal Android APK, launches it on an emulator (a build that crashes on
# start is never published), then publishes it as a GitHub *prerelease*.
#  - Every push to ANY branch builds and publishes a prerelease
#    (tag: v<pubspec version>-pre.<run number>)
#  - Pushing a tag such as v0.1.0-pre.1 uses that tag instead
#  - Or run manually: Actions -> Prerelease -> Run workflow
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: v<pubspec version>-pre.<run number>)'
        required: false
        type: string
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded

      # 7-Zip bridge (RAR/7Z/ISO/CAB, passwords, split volumes) on a plain JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install py7zr pycdlib
      - run: android/engine-test/run_tests.sh

  build:
    name: Build APK
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Reuse downloaded Gradle/Maven artifacts between runs: far fewer requests to
          # Maven Central, which rate-limits (HTTP 429) shared CI runners.
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Work out version and tag
        id: meta
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v${VERSION}-pre.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building $TAG (pubspec $VERSION)"

      - run: flutter pub get

      # Release build signed with the debug key: fine for testing a prerelease,
      # NOT for Google Play. Add a real keystore before publishing to the store.
      # ZIPFAST_TEST_ADS: prerelease APKs show Google's test ads, never live ones
      # (AdMob policy: don't click or generate impressions on your own live ads).
      # Leave it out for a Play Store build.
      - name: Build universal APK
        run: |
          # Maven Central sometimes answers 429 / 5xx to shared runners. Retry with a
          # growing pause (this only helps with download errors; real build errors fail 3x fast).
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "::warning::attempt $attempt failed: $*"
              [ "$attempt" -lt 3 ] && sleep $((attempt * 45))
            done
            return 1
          }
          retry flutter build apk --release \
            --dart-define=ZIPFAST_TEST_ADS=true \
            --build-number="${GITHUB_RUN_NUMBER}"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          TAG="${{ steps.meta.outputs.tag }}"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/ZipFast-${TAG}-universal.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: zipfast-apk
          path: dist/*
          if-no-files-found: error

  smoke:
    name: Launch on emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: zipfast-apk
          path: dist

      - name: Enable KVM (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Installs the APK, starts the app, waits, then fails on a crash, a dead process, or if
      # the app is not on screen. Catches launch crashes that Dart tests cannot (for example
      # code shrinking breaking a library's startup).
      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke_test.sh

      - name: Keep the emulator logs and a screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: smoke/*
          if-no-files-found: ignore

  publish:
    name: Publish prerelease
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zipfast-apk
          path: dist

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          NOTES=$(cat <<NOTE
          **Prerelease** build of ZipFast ${{ needs.build.outputs.version }} (CI run #${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7}).

          - Install \`ZipFast-${TAG}-universal.apk\` (one APK for all devices).
          - Launched successfully on an Android 14 emulator before publishing.
          - Signed with the debug key: for testing only, not for the Play Store.
          - Checksums: \`SHA256SUMS.txt\`.
          NOTE
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --prerelease --notes "$NOTES"
          else
            gh release create "$TAG" dist/* \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "ZipFast ${TAG}" \
              --notes "$NOTES"
          fi
